<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f26"/>
      <stop offset="100%" stop-color="#0f1015"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#gradBg)"/>
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#2a2e39" stroke-width="3" stroke-dasharray="12 8"/>
  
  <!-- Subtle CAD Grid -->
  <path d="M64 160 H448 M64 256 H448 M64 352 H448 M160 64 V448 M256 64 V448 M352 64 V448" stroke="#1f2330" stroke-width="2"/>
  
  <!-- Isometric Cube Framework -->
  <!-- Center: (256, 256) -->
  <!-- Top Face -->
  <polygon points="256,120 376,188 256,256 136,188" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="4" stroke-linejoin="round"/>
  <!-- Left Face -->
  <polygon points="136,188 256,256 256,396 136,328" fill="#06b6d4" fill-opacity="0.08" stroke="#06b6d4" stroke-width="4" stroke-linejoin="round"/>
  <!-- Right Face -->
  <polygon points="256,256 376,188 376,328 256,396" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Golden Technical Compass & Drafting Set Square -->
  <path d="M190 380 L256 160 L322 380" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="160" r="16" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <path d="M210 310 H302" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>

  <!-- Construction Circles / Arcs -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Vertex precision nodes -->
  <circle cx="136" cy="188" r="6" fill="#38bdf8"/>
  <circle cx="376" cy="188" r="6" fill="#38bdf8"/>
  <circle cx="256" cy="396" r="6" fill="#38bdf8"/>
  <circle cx="256" cy="120" r="6" fill="#38bdf8"/>
</svg>
