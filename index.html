<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Ensure window.fetch is safely writable as a standard data property (prevents getter-only error without recursion) */
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var nativeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              value: nativeFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
